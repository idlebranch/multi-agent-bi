services:
  postgres:
    image: postgres:17-alpine
    container_name: multi-agent-bi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BI_POSTGRES_DB:-multi_agent_bi}
      POSTGRES_USER: ${BI_POSTGRES_OWNER:-bi_owner}
      POSTGRES_PASSWORD: ${BI_POSTGRES_OWNER_PASSWORD:?set BI_POSTGRES_OWNER_PASSWORD}
      BI_READONLY_PASSWORD: ${BI_POSTGRES_READONLY_PASSWORD:?set BI_POSTGRES_READONLY_PASSWORD}
    ports:
      - "127.0.0.1:${BI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - olist_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  olist_postgres_data:
