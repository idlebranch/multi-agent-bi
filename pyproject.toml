[project]
name = "bi-agent-test"
version = "0.1.0"
description = "Supervisor-orchestrated multi-agent BI query workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=8.3.0",
    "ruff>=0.15.13",
]
