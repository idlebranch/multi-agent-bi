[project]
name = "multi-agent-bi"
version = "0.1.0"
description = "Production-oriented multi-agent BI workflow for governed PostgreSQL text-to-SQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "pydantic>=2.12.0",
    "psycopg[binary]>=3.3.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pyinstaller>=6.0",
    "pytest>=8.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
markers = [
    "postgres: tests that require a real PostgreSQL instance",
    "docker_contract: static Docker and Compose deployment contracts",
    "live_llm: paid provider tests; never selected by ordinary CI",
]

[tool.ruff]
# Educational notebooks are outside the Production code quality gate.
exclude = ["notebooks"]
